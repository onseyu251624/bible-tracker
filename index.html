        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap');
        *{box-sizing:border-box}
        .row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:5px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);transition:background .15s,transform .1s}
        .row:hover{background:rgba(255,255,255,.09)}
        .row:active{transform:scale(.98)}
        .row.done{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.25)}
        .chk{width:26px;height:26px;border-radius:50%;border:2px solid #475569;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:13px}
        .chk.done{background:#10b981;border-color:#10b981;color:#fff}
        .dcard{border-radius:14px;margin-bottom:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
        .dhead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;background:rgba(255,255,255,.04);transition:background .15s}
        .dhead:hover{background:rgba(255,255,255,.09)}
        .tab{flex:1;padding:10px 2px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;background:transparent;color:#64748b;transition:all .2s}
        .tab.on{background:rgba(16,185,129,.2);color:#10b981}
        .pbar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
        .pfill{height:100%;border-radius:3px;transition:width .4s ease}
